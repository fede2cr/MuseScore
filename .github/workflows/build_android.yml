name: Build Android

on:
  push:
    branches:
      - main
      - museandroid
      - 'android/**'
      - 'tablet/**'
      - 'feature/android*'
    tags:
      - 'android-v*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        required: true
  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        type: string
        required: true
      build_number:
        description: 'Build number (if not provided, will be generated)'
        default: ''
        type: string
        required: false
      app_repo:
        description: 'owner/repo to source MuseScore from (default: this repo)'
        type: string
        required: false
        default: ''
      app_ref:
        description: 'MuseScore ref to check out (default: ref of triggering event)'
        type: string
        required: false
        default: ''
      framework_repo:
        description: 'owner/repo to source muse_framework from (default: pinned submodule)'
        type: string
        required: false
        default: ''
      framework_ref:
        description: 'Ref to check out into the muse_framework submodule (default: pinned SHA)'
        type: string
        required: false
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

concurrency:
  group: ${{ github.workflow }} ${{ github.event_name }} ${{ github.ref }} android
  cancel-in-progress: true

permissions:
  contents: write   # required by softprops/action-gh-release on tag pushes

jobs:
  android_arm64:
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.10.2
      QT_ANDROID_ARCH: android_arm64_v8a
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.app_repo || github.repository }}
        ref: ${{ inputs.app_ref || github.ref }}
        submodules: recursive

    - name: Override muse_framework
      if: ${{ inputs.framework_ref != '' && inputs.framework_repo != '' }}
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.framework_repo }}
        ref: ${{ inputs.framework_ref }}
        path: muse
        submodules: recursive

    - name: Sync and update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Apply Android patches to muse_framework
      run: |
        set -euo pipefail
        bash ./buildscripts/ci/android/patch_setupqt6_android.sh

    - name: Configure workflow
      id: configure
      run: |
        set -euo pipefail

        IS_TAG_RELEASE=false
        RELEASE_VERSION=""
        if [ "${{ github.ref_type }}" = "tag" ] && [[ "${{ github.ref_name }}" == android-v* ]]; then
          IS_TAG_RELEASE=true
          RELEASE_VERSION="${{ github.ref_name }}"
          RELEASE_VERSION="${RELEASE_VERSION#android-v}"
        fi

        BUILD_MODE="${{ inputs.build_mode }}"
        if [ "$IS_TAG_RELEASE" = "true" ]; then
          # Tag pushes are always release builds, regardless of input.
          BUILD_MODE="stable"
        else
          BUILD_MODE="${BUILD_MODE:-devel}"
        fi

        bash ./buildscripts/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m "$BUILD_MODE"
        if [ -n "${{ inputs.build_number }}" ]; then
          bash ./buildscripts/ci/tools/make_build_number.sh "${{ inputs.build_number }}"
        else
          bash ./buildscripts/ci/tools/make_build_number.sh
        fi
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        if [ "$IS_TAG_RELEASE" = "true" ]; then
          UPLOAD_ARTIFACT_NAME="MuseScore_${RELEASE_VERSION}_Android_arm64"
        else
          UPLOAD_ARTIFACT_NAME="MU4_${BUILD_NUMBER}_Android_arm64"
        fi

        echo "build_mode=$BUILD_MODE" >> $GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "upload_artifact_name=$UPLOAD_ARTIFACT_NAME" >> $GITHUB_OUTPUT
        echo "is_tag_release=$IS_TAG_RELEASE" >> $GITHUB_OUTPUT
        echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

        # Expose BUILD_MODE to subsequent steps that read it from the env.
        echo "BUILD_MODE=$BUILD_MODE" >> $GITHUB_ENV

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.12916984" "build-tools;35.0.0" "platforms;android-35"
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" | tee -a $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.0.12916984" | tee -a $GITHUB_ENV

    - name: Install Qt for Android
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: linux
        target: android
        arch: ${{ env.QT_ANDROID_ARCH }}
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets qtmultimedia'
        cache: true

    - name: Restore sccache files
      id: restore-sccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/.sccache
        key: android-${{ runner.os }}-${{ runner.arch }}-sccache-
        restore-keys: android-${{ runner.os }}-${{ runner.arch }}-sccache-

    - name: Setup sccache
      run: |
        sudo apt-get update
        sudo apt-get install -y sccache

        SCCACHE_PATH="$(command -v sccache)"
        SCCACHE_DIR="${GITHUB_WORKSPACE}/.sccache"
        mkdir -p "$SCCACHE_DIR"

        echo "Cache restore matched key: ${{ steps.restore-sccache.outputs.cache-matched-key }}"
        echo "Cache restore primary key: ${{ steps.restore-sccache.outputs.cache-primary-key }}"
        echo "Cache hit (exact): ${{ steps.restore-sccache.outputs.cache-hit }}"
        echo "Contents of SCCACHE_DIR ($SCCACHE_DIR):"
        ls -la "$SCCACHE_DIR" || echo "  (empty or missing)"
        echo "Size of SCCACHE_DIR:"
        du -sh "$SCCACHE_DIR" 2>/dev/null || true

        echo "SCCACHE_PATH=$SCCACHE_PATH" | tee -a "$GITHUB_ENV"
        echo "SCCACHE_DIR=$SCCACHE_DIR" | tee -a "$GITHUB_ENV"
        echo "SCCACHE_BASE_DIR=$GITHUB_WORKSPACE" | tee -a "$GITHUB_ENV"
        echo "SCCACHE_NOHASHDIR=true" | tee -a "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=2G" | tee -a "$GITHUB_ENV"
        echo "MUSESCORE_BUILD_NUMBER_FOR_COMPILE=0" | tee -a "$GITHUB_ENV"
        echo "CMAKE_C_COMPILER_LAUNCHER=$SCCACHE_PATH" | tee -a "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=$SCCACHE_PATH" | tee -a "$GITHUB_ENV"

        # Start the sccache server with these env vars so it picks them up,
        # otherwise the server may have already been spawned with defaults.
        SCCACHE_DIR="$SCCACHE_DIR" \
        SCCACHE_BASE_DIR="$GITHUB_WORKSPACE" \
        SCCACHE_NOHASHDIR=true \
        SCCACHE_CACHE_SIZE=2G \
        "$SCCACHE_PATH" --stop-server >/dev/null 2>&1 || true
        SCCACHE_DIR="$SCCACHE_DIR" \
        SCCACHE_BASE_DIR="$GITHUB_WORKSPACE" \
        SCCACHE_NOHASHDIR=true \
        SCCACHE_CACHE_SIZE=2G \
        "$SCCACHE_PATH" --start-server

        "$SCCACHE_PATH" --zero-stats || true
        echo "Initial sccache stats (after restore, before build):"
        "$SCCACHE_PATH" --show-stats || true

    - name: Build Android artifact
      env:
        QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        SCCACHE_PATH: ${{ env.SCCACHE_PATH }}
        SCCACHE_DIR: ${{ env.SCCACHE_DIR }}
        SCCACHE_BASE_DIR: ${{ env.SCCACHE_BASE_DIR }}
        SCCACHE_NOHASHDIR: ${{ env.SCCACHE_NOHASHDIR }}
        SCCACHE_CACHE_SIZE: ${{ env.SCCACHE_CACHE_SIZE }}
        MUSESCORE_BUILD_NUMBER_FOR_COMPILE: ${{ env.MUSESCORE_BUILD_NUMBER_FOR_COMPILE }}
        CMAKE_C_COMPILER_LAUNCHER: ${{ env.CMAKE_C_COMPILER_LAUNCHER }}
        CMAKE_CXX_COMPILER_LAUNCHER: ${{ env.CMAKE_CXX_COMPILER_LAUNCHER }}
      run: |
        chmod +x ./buildscripts/ci/android/build.sh
        bash ./buildscripts/ci/android/build.sh -n ${{ steps.configure.outputs.build_number }} --build_mode "${BUILD_MODE}"

    - name: Verify AndroidManifest in built APK
      if: always()
      run: |
        set -uo pipefail

        APK_PATH="$(find ./build.android.release ./build.artifacts/android -type f -name '*.apk' 2>/dev/null | head -n 1 || true)"
        if [ -z "$APK_PATH" ]; then
          echo "No APK found to inspect; skipping manifest verification."
          exit 0
        fi
        echo "Inspecting APK: $APK_PATH"

        AAPT2="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
        AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

        MANIFEST_DUMP=""
        if [ -x "$AAPT2" ]; then
          MANIFEST_DUMP="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK_PATH" 2>/dev/null || true)"
        fi
        if [ -z "$MANIFEST_DUMP" ] && [ -x "$AAPT" ]; then
          MANIFEST_DUMP="$("$AAPT" dump xmltree "$APK_PATH" AndroidManifest.xml 2>/dev/null || true)"
        fi

        if [ -z "$MANIFEST_DUMP" ]; then
          echo "::warning::Could not dump AndroidManifest.xml from the APK."
          exit 0
        fi

        echo "----- packaged AndroidManifest.xml (decoded) -----"
        echo "$MANIFEST_DUMP"
        echo "--------------------------------------------------"

        echo "===== Checks ====="
        FAIL=0
        if echo "$MANIFEST_DUMP" | grep -q 'application/x-musescore'; then
          echo "OK: mscz MIME intent-filter present"
        else
          echo "::error::mscz MIME intent-filter (application/x-musescore) NOT found in packaged manifest -> our AndroidManifest.xml was not used"
          FAIL=1
        fi
        if echo "$MANIFEST_DUMP" | grep -q '\.mscz'; then
          echo "OK: .mscz pathPattern present"
        else
          echo "::error::.mscz pathPattern NOT found in packaged manifest"
          FAIL=1
        fi
        if [ "$FAIL" -ne 0 ]; then
          echo "::error::The custom manifest is missing from the APK. Check QT_ANDROID_PACKAGE_SOURCE_DIR wiring."
        fi

    - name: Show sccache stats
      if: always()
      run: |
        sccache --show-stats || true
        echo "Final SCCACHE_DIR size (this is what gets saved):"
        du -sh "${SCCACHE_DIR:-/home/runner/work/MuseScore/MuseScore/.sccache}" 2>/dev/null || true
        echo "Top-level entries in SCCACHE_DIR:"
        ls -la "${SCCACHE_DIR:-/home/runner/work/MuseScore/MuseScore/.sccache}" 2>/dev/null | head -20 || true

    - name: Sign APK (optional)
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail

        if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
          if [ "${{ steps.configure.outputs.is_tag_release }}" = "true" ]; then
            echo "error: signing secrets are required for tag releases (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)" >&2
            exit 1
          fi
          echo "Signing secrets are not fully configured, skipping APK signing"
          exit 0
        fi

        KEYSTORE_PATH="$RUNNER_TEMP/android-release.keystore"
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

        APK_PATH="$(find ./build.artifacts/android -type f -name "*.apk" | head -n 1 || true)"
        if [ -z "$APK_PATH" ]; then
          echo "No APK found for signing, skipping"
          exit 0
        fi

        BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/35.0.0"
        ALIGNED_APK="${APK_PATH%.apk}-aligned.apk"
        SIGNED_APK="${APK_PATH%.apk}-signed.apk"

        "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK_PATH" "$ALIGNED_APK"
        "$BUILD_TOOLS_DIR/apksigner" sign \
          --ks "$KEYSTORE_PATH" \
          --ks-key-alias "$ANDROID_KEY_ALIAS" \
          --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
          --key-pass "pass:$ANDROID_KEY_PASSWORD" \
          --out "$SIGNED_APK" \
          "$ALIGNED_APK"

        "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"

    - name: Build checksums and artifact summary
      run: |
        set -euo pipefail

        if [ ! -d ./build.artifacts/android ]; then
          echo "error: ./build.artifacts/android not found" >&2
          exit 1
        fi

        (cd ./build.artifacts/android && sha256sum ./* > checksums.sha256)

        {
          echo "### Android Build Outputs"
          echo
          echo "Build number: ${{ steps.configure.outputs.build_number }}"
          echo
          echo "Files in build.artifacts/android:"
          find ./build.artifacts/android -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | sed 's/^/- /'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifacts on GitHub
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.configure.outputs.upload_artifact_name }}
        path: ./build.artifacts/android/
        if-no-files-found: error
        retention-days: 14

    - name: Create GitHub Release
      if: steps.configure.outputs.is_tag_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: MuseScore Android ${{ steps.configure.outputs.release_version }}
        draft: false
        prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          build.artifacts/android/*-signed.apk
          build.artifacts/android/checksums.sha256

    - name: Prepare sccache files for saving
      id: prepare-save-sccache
      if: always()
      run: |
        echo "SCCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a "$GITHUB_OUTPUT"

    - name: Save sccache files
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-sccache.outputs.cache-primary-key }}${{ steps.prepare-save-sccache.outputs.SCCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.sccache
